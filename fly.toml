app = "calendar-sync-ljbw-w"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  AGENDA_PROXY_PUBLIC_KEY = "MCowBQYDK2VwAyEA1tohuEFMs6W701ldJp7C5G0JywcobYrjQNv89KgYgQ4="

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[mounts]
  source = "calendar_data"
  destination = "/data"
